services:
  db:
    image: postgres:17
    container_name: gymbros-db
    environment:
      POSTGRES_USER: gymbros
      POSTGRES_PASSWORD: gymbros
      POSTGRES_DB: gymbros
    ports:
      - "5434:5432"
    volumes:
      - gymbros-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gymbros"]
      interval: 5s
      retries: 10
volumes:
  gymbros-pg:
